openapi: 3.0.3
info:
  title: Claude Master Brain & Management API
  version: 0.1.0
  description: Unified REST API consumed by cm CLI and Studio UI.
servers:
- url: http://127.0.0.1:7700
paths:
  /api/v1/status:
    get:
      operationId: status
      summary: System component status
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
  /api/v1/bypass:
    get:
      operationId: bypass_status
      summary: Get bypass mode status
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
    post:
      operationId: bypass_set
      summary: Set bypass mode on or off
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
  /api/v1/system/lifecycle:
    post:
      operationId: lifecycle
